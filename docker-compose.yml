services:
  pyspark-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pyspark-app
    working_dir: /app
    user: "0:0"
    volumes:
      - ~/.ivy2/tmp:/tmp/.ivy2
      - ./config:/app/config
      - ./src:/app/src
      - ./data:/app/data
      - ./scripts:/app/scripts
      - shared-data:/app/data
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - HOME=/opt/bitnami
      - SPARK_LOCAL_DIRS=/tmp
      - SPARK_WORKER_DIR=/tmp
      - HADOOP_USER_NAME=root
      - SPARK_USER=root
      - HADOOP_CONF_DIR=/opt/bitnami/spark/conf
      - SPARK_JARS_IVY=/tmp/.ivy2
      - SPARK_OPTS=--conf spark.hadoop.security.authentication=simple
      - PYSPARK_PYTHON=python3.12
      - PYSPARK_DRIVER_PYTHON=python3.12
    networks:
      - flatten_app_network
      - cluster_network
    ports:
      - "4040:4040"
    entrypoint: ["sh", "-c", "sh scripts/sh/run_spark.sh \"$@\"", "--"]
#    entrypoint: ["bash"]

  pyspark-app-test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - ./config:/app/config
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data:/app/data
      - shared-data:/app/data
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - HOME=/opt/bitnami
      - SPARK_LOCAL_DIRS=/tmp
      - SPARK_WORKER_DIR=/tmp
      - HADOOP_USER_NAME=root
      - SPARK_USER=root
      - HADOOP_CONF_DIR=/opt/bitnami/spark/conf
      - SPARK_JARS_IVY=/tmp/.ivy2
      - SPARK_OPTS=--conf spark.hadoop.security.authentication=simple
      - PYSPARK_PYTHON=python3.12
      - PYSPARK_DRIVER_PYTHON=python3.12
      - PYTHONPATH=src
    networks:
      - flatten_app_network
      - cluster_network
    entrypoint: ["pytest", "tests/"]

volumes:
  shared-data:
    external: true

networks:
  flatten_app_network:
    driver: bridge
  cluster_network:
    external: true